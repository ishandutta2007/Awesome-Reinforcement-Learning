<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B19" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1035" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.2" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="neon-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-25px) translateX(15px); opacity: 0.7; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes orbitNode {
      0% { transform: rotate(0deg) translateX(45px) rotate(0deg); }
      100% { transform: rotate(360deg) translateX(45px) rotate(-360deg); }
    }
    .pulsing-orb-1 {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .pulsing-orb-2 {
      animation: pulseGlow 8s ease-in-out infinite 2s;
      transform-origin: 1000px 220px;
    }
    .particle-1 { animation: floatParticle 7s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 9s ease-in-out infinite 1.5s; }
    .particle-3 { animation: floatParticle 8s ease-in-out infinite 3s; }
    .signal-flow {
      stroke-dasharray: 12, 12;
      animation: flowLine 14s linear infinite;
    }
    .orbiting-agent {
      animation: orbitNode 12s linear infinite;
      transform-origin: 1050px 110px;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="340" rx="16" fill="url(#cyber-grid)" />

  <!-- Dynamic Ambient Glowing Orbs (Background layer) -->
  <circle class="pulsing-orb-1" cx="200" cy="100" r="140" fill="url(#accent-cyan)" filter="url(#neon-blur)" />
  <circle class="pulsing-orb-2" cx="1000" cy="220" r="160" fill="url(#accent-purple)" filter="url(#neon-blur)" />

  <!-- Animated RL Agent-Environment Loop Connectors (Background layer) -->
  <g opacity="0.35">
    <path class="signal-flow" d="M 120 280 C 260 220, 320 310, 480 270 C 640 230, 800 320, 1080 250" fill="none" stroke="#38BDF8" stroke-width="2" />
    <path class="signal-flow" d="M 80 80 C 300 40, 500 130, 750 60 C 950 0, 1050 140, 1140 90" fill="none" stroke="#A855F7" stroke-width="2" />
  </g>

  <!-- Dynamic Floating Nodes (Reward & State Indicators) -->
  <circle class="particle-1" cx="160" cy="70" r="4" fill="#38BDF8" filter="url(#subtle-glow)" />
  <circle class="particle-2" cx="310" cy="290" r="5" fill="#C084FC" filter="url(#subtle-glow)" />
  <circle class="particle-3" cx="890" cy="60" r="4.5" fill="#34D399" filter="url(#subtle-glow)" />
  <circle class="particle-1" cx="1060" cy="290" r="4" fill="#F472B6" filter="url(#subtle-glow)" />

  <!-- Agent-Environment Schematic Accent (Right Side) -->
  <g transform="translate(1050, 110)" opacity="0.8">
    <circle cx="0" cy="0" r="42" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-dasharray="4,4" />
    <circle cx="0" cy="0" r="16" fill="#1E293B" stroke="#818CF8" stroke-width="3" />
    <text x="0" y="5" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#38BDF8" text-anchor="middle">S, R</text>
    <circle class="orbiting-agent" cx="0" cy="0" r="8" fill="#F43F5E" filter="url(#subtle-glow)" />
  </g>

  <!-- Foreground Content: Shield / Pill Tag -->
  <g transform="translate(600, 56)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />
    <text x="0" y="5" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="2.5" fill="#38BDF8" text-anchor="middle">
      ⚡ THE DEFINITIVE RL ECOSYSTEM ⚡
    </text>
  </g>

  <!-- Main Title (Unobstructed Foreground) -->
  <text x="600" y="145" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="-0.5" fill="url(#primary-glow)" text-anchor="middle" filter="url(#subtle-glow)">
    Awesome Reinforcement Learning
  </text>

  <!-- Subtitle (Unobstructed Foreground) -->
  <text x="600" y="195" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="19" font-weight="500" fill="#E2E8F0" text-anchor="middle" opacity="0.95">
    Algorithms • Distributed Policy Training • Simulation Environments • SaaS &amp; Open-Source
  </text>

  <!-- Feature Pills Bar -->
  <g transform="translate(600, 260)">
    <!-- Pill 1: RLlib & TorchRL -->
    <g transform="translate(-360, 0)">
      <rect x="-70" y="-15" width="140" height="30" rx="15" fill="rgba(15, 23, 42, 0.85)" stroke="#38BDF8" stroke-width="1.2" />
      <text x="0" y="5" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#BAE6FD" text-anchor="middle">Ray RLlib &amp; TorchRL</text>
    </g>
    <!-- Pill 2: Gymnasium & PettingZoo -->
    <g transform="translate(-180, 0)">
      <rect x="-85" y="-15" width="170" height="30" rx="15" fill="rgba(15, 23, 42, 0.85)" stroke="#818CF8" stroke-width="1.2" />
      <text x="0" y="5" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#E0E7FF" text-anchor="middle">Gymnasium &amp; PettingZoo</text>
    </g>
    <!-- Pill 3: PPO, SAC & GRPO -->
    <g transform="translate(10, 0)">
      <rect x="-80" y="-15" width="160" height="30" rx="15" fill="rgba(15, 23, 42, 0.85)" stroke="#C084FC" stroke-width="1.2" />
      <text x="0" y="5" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#F3E8FF" text-anchor="middle">PPO • SAC • GRPO</text>
    </g>
    <!-- Pill 4: Isaac Lab Simulation -->
    <g transform="translate(195, 0)">
      <rect x="-80" y="-15" width="160" height="30" rx="15" fill="rgba(15, 23, 42, 0.85)" stroke="#34D399" stroke-width="1.2" />
      <text x="0" y="5" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#D1FAE5" text-anchor="middle">Isaac Lab GPU Sim</text>
    </g>
    <!-- Pill 5: RLHF & LLM Post-Training -->
    <g transform="translate(380, 0)">
      <rect x="-85" y="-15" width="170" height="30" rx="15" fill="rgba(15, 23, 42, 0.85)" stroke="#F472B6" stroke-width="1.2" />
      <text x="0" y="5" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#FCE7F3" text-anchor="middle">RLHF &amp; Post-Training</text>
    </g>
  </g>

  <!-- Border Highlight -->
  <rect width="1200" height="340" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
</svg>
